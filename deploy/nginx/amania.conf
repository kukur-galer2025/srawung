# Nginx untuk Amania: dua subdomain di satu server.
#   https://<domain-anda>      → frontend Next.js (port 3000)
#   https://api.<domain-anda>  → backend Laravel (PHP-FPM)
#
# Pasang:
#   sudo cp deploy/nginx/amania.conf /etc/nginx/sites-available/amania
#   (ganti domain-anda.id dan versi php8.4-fpm bila berbeda)
#   sudo ln -s /etc/nginx/sites-available/amania /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d domain-anda.id -d www.domain-anda.id -d api.domain-anda.id
#   (certbot otomatis menambahkan blok HTTPS dan pengalihan http → https)

# ── Backend API ───────────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.domain-anda.id;
    root /var/www/amania/backend/public;
    index index.php;

    # PDF buku hingga 50 MB (lihat validasi unggah di Admin\BookController).
    client_max_body_size 60M;

    server_tokens off;
    charset utf-8;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Sampul, QRIS, gambar blog (php artisan storage:link).
    location /storage/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Tolak file PHP lain & file tersembunyi (.env, .git, dll.).
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}

# ── Frontend Next.js ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name domain-anda.id www.domain-anda.id;

    server_tokens off;
    client_max_body_size 10M;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
