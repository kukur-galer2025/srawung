; Queue worker Amania — dijaga Supervisor: otomatis jalan saat server menyala,
; dan otomatis dihidupkan ulang bila mati/crash.
;
; Pasang:
;   sudo apt install supervisor
;   sudo cp deploy/supervisor/amania-worker.conf /etc/supervisor/conf.d/
;   (sesuaikan /var/www/amania dan user www-data di bawah)
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl status
;
; Setelah setiap deploy kode baru:
;   php artisan queue:restart     (worker selesai tugasnya lalu dimulai ulang dengan kode baru)

[program:amania-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/amania/backend/artisan queue:work database --sleep=3 --tries=3 --timeout=1800 --max-time=3600
directory=/var/www/amania/backend
user=www-data
numprocs=1
autostart=true
autorestart=true
startsecs=3
; Beri waktu konversi PDF besar selesai sebelum dipaksa berhenti.
stopwaitsecs=1810
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/amania/backend/storage/logs/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
